{% extends 'base.html' %}

{% block title %}Request Session | Skillora{% endblock %}

{% block content %}
<section class="container auth-wrap">
    <div class="auth-card wide-form">
        <h1>Request a learning session</h1>
        <form method="post">
            {% csrf_token %}
            <label for="to_user">Send to</label>
            <select name="to_user" id="to_user" class="form-select">
                {% for user in recipients %}
                    <option value="{{ user.id }}">{{ user.get_full_name|default:user.username }} ({{ user.role|title }})</option>
                {% endfor %}
            </select>
            {{ form.as_p }}
            <button type="submit" class="button primary full-width">Send request</button>
        </form>
    </div>
</section>
{% endblock %}
